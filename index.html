<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tie Network Rewards</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
}

.card{
    background:#111827;
    border-radius:20px;
    padding:25px;
    box-shadow:0 0 25px rgba(0,255,170,.15);
    margin-bottom:20px;
}

h1,h2{
    text-align:center;
    margin-bottom:15px;
}

.subtitle{
    text-align:center;
    color:#94a3b8;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    border:none;
    outline:none;
    border-radius:10px;
    margin-bottom:12px;
    background:#1e293b;
    color:white;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#00c853;
    color:white;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#00b248;
}

.admin-btn{
    margin-top:10px;
    background:#2563eb;
}

.clear-btn{
    margin-top:10px;
    background:#dc2626;
}

#result,#claims{
    margin-top:15px;
}

.claim{
    background:#1e293b;
    padding:10px;
    border-radius:10px;
    margin-top:10px;
    line-height:1.7;
}

hr{
    border:none;
    height:1px;
    background:#334155;
    margin:10px 0;
}
</style>
</head>
<body>

<div class="container">

<div class="card">
    <h1>🎁 Tie Network Rewards</h1>
    <p class="subtitle">Redeem your reward code and submit your UPI ID.</p>

    <input type="text" id="code" placeholder="Enter Redeem Code">
    <input type="text" id="upi" placeholder="Enter Your UPI ID">

    <button onclick="redeemCode()">Redeem Reward</button>

    <div id="result"></div>
</div>

<div class="card">
    <h2>🔐 Admin Panel</h2>

    <input type="password" id="adminPassword" placeholder="Admin Password">

    <button class="admin-btn" onclick="showClaims()">View Claims</button>
    <button class="clear-btn" onclick="clearClaims()">Clear Claims</button>

    <div id="claims"></div>
</div>

</div>

<script>
const validCodes = {
    "TIENETWORK42": "₹10",
    "TIENETWORK25": "₹25"
};

const ADMIN_PASSWORD = "dreamo123";

function redeemCode(){
    const code = document.getElementById("code").value.trim().toUpperCase();
    const upi = document.getElementById("upi").value.trim();
    const result = document.getElementById("result");

    if(!validCodes[code]){
        result.innerHTML = "<p style='color:red'>❌ Invalid Redeem Code</p>";
        return;
    }

    if(upi === "" || !upi.includes("@")){
        result.innerHTML = "<p style='color:red'>❌ Enter a valid UPI ID</p>";
        return;
    }

    let claims = JSON.parse(localStorage.getItem("claims")) || [];

    claims.push({
        code: code,
        reward: validCodes[code],
        upi: upi,
        status: "Pending Payment",
        time: new Date().toLocaleString()
    });

    localStorage.setItem("claims", JSON.stringify(claims));

    result.innerHTML = `
        <div class="claim">
            ✅ Reward Claim Submitted<br><br>
            Reward: <b>${validCodes[code]}</b><br>
            UPI ID: <b>${upi}</b><br><br>
            Please wait for <b>Tie Network</b> to verify and send your payment.
        </div>
    `;
}

function showClaims(){
    const pass = document.getElementById("adminPassword").value;
    const claimsBox = document.getElementById("claims");

    if(pass !== ADMIN_PASSWORD){
        claimsBox.innerHTML = "<p style='color:red'>❌ Wrong Admin Password</p>";
        return;
    }

    const claims = JSON.parse(localStorage.getItem("claims")) || [];

    if(claims.length === 0){
        claimsBox.innerHTML = "<p>No Claims Yet.</p>";
        return;
    }

    claimsBox.innerHTML = "<h3>📋 Pending Claims</h3>";

    claims.forEach((claim,index)=>{
        claimsBox.innerHTML += `
        <div class="claim">
            <b>Claim #${index+1}</b>
            <hr>
            Code: ${claim.code}<br>
            Reward: ${claim.reward}<br>
            UPI: ${claim.upi}<br>
            Status: ${claim.status}<br>
            Time: ${claim.time}
        </div>
        `;
    });
}

function clearClaims(){
    const pass = document.getElementById("adminPassword").value;

    if(pass !== ADMIN_PASSWORD){
        document.getElementById("claims").innerHTML =
        "<p style='color:red'>❌ Wrong Admin Password</p>";
        return;
    }

    localStorage.removeItem("claims");

    document.getElementById("claims").innerHTML =
    "<p style='color:lime'>✅ All Claims Cleared</p>";
}
</script>

</body>
</html>
